<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header class="nav-bar">
        <div class="brand">wroth.lol/wroth</div>
        <a href="#" class="home-btn">home</a>
    </header>

    <main class="container">
        
        <section class="profile-card">
            
            <div class="badge-row">
                <div class="left-badges">
                    <i class="fa-solid fa-crown" title="Premium"></i>
                    <i class="fa-solid fa-code" title="Developer"></i>
                    <i class="fa-brands fa-twitter" title="Twitter"></i>
                    <i class="fa-solid fa-heart" title="Supporter"></i>
                    <i class="fa-solid fa-shield-halved" title="Verified"></i>
                </div>
                <div class="view-count">
                    <i class="fa-regular fa-eye"></i> 212
                </div>
            </div>

            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=150&h=150&fit=crop" alt="Avatar" class="avatar">
                <span class="status-dot"></span>
            </div>

            <h1 class="username">wroth</h1>
            <p class="subtext">@wroth</p>
            
            <p class="status-quote">Welcome to my profile</p>

            <nav class="links-wrapper">
                <a href="https://steamcommunity.com" target="_blank" class="link-item">
                    <i class="fa-brands fa-steam"></i> Steam
                </a>
                <a href="https://discord.com" target="_blank" class="link-item">
                    <i class="fa-brands fa-discord"></i> Discord
                </a>
                <a href="https://github.com" target="_blank" class="link-item">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <a href="#" class="link-item">
                    <i class="fa-solid fa-link"></i> donator showcase
                </a>
            </nav>
            
        </section>

        <footer class="audio-player">
            <div class="track-art">
                <i class="fa-solid fa-music"></i>
            </div>
            <div class="track-info">
                <div class="track-meta">
                    <span class="track-name">Queen St.</span>
                    <span class="track-artist">by twentythree</span>
                </div>
                <div class="progress-container">
                    <span class="time-stamp">0:47</span>
                    <div class="progress-bar">
                        <div class="progress-current"></div>
                    </div>
                    <span class="time-stamp">2:02</span>
                </div>
            </div>
            <div class="controls">
                <i class="fa-solid fa-pause"></i>
            </div>
        </footer>

    </main>

</body>
</html>
