<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wroth.lol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
</head>
<body>

    <div class="bg-media-container">
        <img src="" alt="Purple Sword Background" class="bg-media">
    </div>

    <div class="vignette-overlay"></div>
    <div class="scanlines"></div>
    <div class="matrix-grid"></div>

    <div class="profile-card">
        
        <div class="status-badge">
            <span class="pulse-indicator"></span>
            <span class="pulse-ripple"></span>
            ACTIVE
        </div>

        <div class="pfp-frame">
            <img src="logo.png" alt="Wroth Profile Picture" class="pfp-img">
        </div>

        <h1 class="display-name">Wroth</h1>
        <p class="sub-handle">wroth.lol/you</p>

        <p class="bio-description">
            Sharper than steel. // Unstoppable. <br>
            <span>"Forged in the dark."</span>
        </p>

        <div class="links-grid">
            <a href="https://github.com" target="_blank" class="bio-link">
                <span class="link-title">GitHub</span>
                <span class="link-icon">↗</span>
            </a>
            
            <a href="https://x.com" target="_blank" class="bio-link">
                <span class="link-title">Twitter / X</span>
                <span class="link-icon">↗</span>
            </a>
            
            <a href="https://discord.com" target="_blank" class="bio-link">
                <span class="link-title">Discord</span>
                <span class="link-icon">↗</span>
            </a>
        </div>

        <div class="card-footer">
            wroth.lol // © 2026
        </div>
    </div>

</body>
</html>
